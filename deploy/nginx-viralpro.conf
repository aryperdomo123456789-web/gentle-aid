# Ecossistema Viral — configuração Nginx (aaPanel)
# Cole no painel: Site > viralpro.vr766.com > Config File
# (mantenha as linhas de SSL que o aaPanel gerar)

server {
    listen 80;
    server_name viralpro.vr766.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name viralpro.vr766.com;

    # ssl_certificate / ssl_certificate_key: gerados pelo aaPanel (Let's Encrypt)

    client_max_body_size 600M;
    client_body_timeout 600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    access_log /www/wwwlogs/viralpro.vr766.com.log;
    error_log  /www/wwwlogs/viralpro.vr766.com.error.log;

    # ---- API Flask (Gunicorn :8000) --------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # ---- Arquivos finais servidos direto pelo disco ----------------------
    location /downloads/ {
        alias /www/wwwroot/viralpro.vr766.com/fabrica_clips/;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "private, max-age=3600";
        try_files $uri =404;
    }

    # ---- Frontend (Node :3000) -------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
